<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Basic HTML Form</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f4f6f8;
        }

        .form-container {
            background: #ffffff;
            width: 100%;
            max-width: 400px;
            padding: 24px;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
        }

        .form-container h2 {
            margin-bottom: 20px;
            text-align: center;
            color: #333;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            color: #555;
        }

        input,
        textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
        }

        input:focus,
        textarea:focus {
            border-color: #2563eb;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #2563eb;
            border: none;
            border-radius: 6px;
            color: #ffffff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            background-color: #1e4fd8;
        }
    </style>
</head>

<body>

    <form class="form-container" id="contactForm">
        <h2>Contact Us</h2>

        <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" placeholder="Enter your name" required>
        </div>

        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="Enter your email" required>
        </div>

        <div class="form-group">
            <label for="message">Message</label>
            <textarea id="message" placeholder="Write your message"></textarea>
        </div>

        <button type="button" id="buttonSubmit">Submit</button>
    </form>

    <script>

        // document.querySelector("#buttonSubmit").addEventListener('click', function(){

        // });

        $("#buttonSubmit").on('click', function () {
            $("#contactForm").submit();
        });

        $("#contactForm").on('submit', function (submitEvent) {
            console.log(submitEvent);
            submitEvent.preventDefault();

            let data = {
                "name": $('#name').val(),
                "email": $('#email').val(),
                "message": $('#message').val(),
            };

            $.post(
                "/jquery.php",
                data,
                function (data, status) {
                    Swal.fire({
                        title: 'Success!',
                        text: 'Form Submitted: ' + JSON.stringify(data),
                        icon: 'success',
                        confirmButtonText: 'Ok'
                    });

                    $("#contactForm").hide();
                }

            ).fail(function (response) {
                
                responseJson = response.responseText;

                responseMessage = JSON.parse(responseJson);

                Swal.fire({
                    title: 'Failed to submit form',
                    text: responseMessage.data,
                    icon: 'error',
                    confirmButtonText: 'Ok'
                });
                
            });
        });
    </script>

</body>

</html>
